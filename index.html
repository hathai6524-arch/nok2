<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AR Flying Bird</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>


    <style>

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* -------------------------
           สถานะ Marker
        ------------------------- */

        #status {

            position: fixed;

            top: 15px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 9999;

            background: rgba(0,0,0,0.75);

            color: white;

            padding: 10px 18px;

            border-radius: 20px;

            font-size: 15px;

            text-align: center;

        }


        /* -------------------------
           Control Panel
        ------------------------- */

        #controls {

            position: fixed;

            bottom: 20px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 9999;

            width: 90%;

            max-width: 430px;

            background: rgba(0,0,0,0.78);

            border-radius: 20px;

            padding: 15px;

            color: white;

            text-align: center;

        }


        #controls h2 {

            margin: 5px 0 12px;

            font-size: 21px;

        }


        #speedText {

            font-size: 18px;

            margin-bottom: 10px;

        }


        button {

            border: none;

            border-radius: 12px;

            padding: 12px 18px;

            margin: 5px;

            font-size: 16px;

            font-weight: bold;

            background: #2196f3;

            color: white;

            cursor: pointer;

        }


        button:active {

            transform: scale(0.94);

        }


        #stopButton {

            background: #f44336;

        }

    </style>

</head>


<body>


<!-- =========================================
     STATUS
========================================= -->

<div id="status">

    🔍 กรุณาส่องกล้องไปที่ Hiro Marker

</div>


<!-- =========================================
     CONTROL
========================================= -->

<div id="controls">

    <h2>🐦 AR Flying Bird</h2>

    <div id="speedText">

        ความเร็วนก: 0

    </div>


    <button onclick="increaseSpeed()">

        ➕ เพิ่มความเร็ว

    </button>


    <button onclick="decreaseSpeed()">

        ➖ ลดความเร็ว

    </button>


    <br>


    <button id="stopButton"
            onclick="toggleFlight()">

        ⏹ หยุดบิน

    </button>

</div>


<!-- =========================================
     AR SCENE
========================================= -->

<a-scene

    embedded

    vr-mode-ui="enabled: false"

    renderer="logarithmicDepthBuffer: true"

    arjs="
        sourceType: webcam;
        debugUIEnabled: false;
    "

>


    <!-- Camera -->

    <a-camera

        position="0 0 0"

        look-controls="enabled: false">

    </a-camera>



    <!-- =====================================
         HIRO MARKER
    ====================================== -->

    <a-marker

        id="hiroMarker"

        preset="hiro"

        smooth="true"

        smooth-count="10"

        smooth-tolerance="0.01"

        smooth-threshold="5"

    >


        <!-- =================================
             BIRD
        ================================== -->

        <a-entity

            id="bird"

            position="0 1 0"

            scale="0.8 0.8 0.8"

        >


            <!-- =============================
                 BODY
            ============================== -->

            <a-sphere

                position="0 0 0"

                radius="0.35"

                color="#795548"

            >
            </a-sphere>


            <!-- =============================
                 HEAD
            ============================== -->

            <a-sphere

                position="0 0.28 0.02"

                radius="0.25"

                color="#8d6e63"

            >
            </a-sphere>


            <!-- =============================
                 EYE LEFT
            ============================== -->

            <a-sphere

                position="-0.16 0.35 0.18"

                radius="0.045"

                color="black"

            >
            </a-sphere>


            <!-- =============================
                 EYE RIGHT
            ============================== -->

            <a-sphere

                position="0.16 0.35 0.18"

                radius="0.045"

                color="black"

            >
            </a-sphere>


            <!-- =============================
                 BEAK
            ============================== -->

            <a-cone

                position="0 0.28 0.28"

                radius-bottom="0.10"

                radius-top="0"

                height="0.25"

                rotation="90 0 0"

                color="#ff9800"

            >
            </a-cone>


            <!-- =============================
                 LEFT WING
            ============================== -->

            <a-entity

                id="leftWing"

                position="-0.30 0 0"

            >

                <a-sphere

                    position="-0.20 0 0"

                    scale="0.55 0.12 0.30"

                    color="#5d4037"

                >
                </a-sphere>

            </a-entity>


            <!-- =============================
                 RIGHT WING
            ============================== -->

            <a-entity

                id="rightWing"

                position="0.30 0 0"

            >

                <a-sphere

                    position="0.20 0 0"

                    scale="0.55 0.12 0.30"

                    color="#5d4037"

                >
                </a-sphere>

            </a-entity>


            <!-- =============================
                 TAIL
            ============================== -->

            <a-cone

                position="0 -0.05 -0.32"

                radius-bottom="0.25"

                radius-top="0"

                height="0.45"

                rotation="-90 0 0"

                color="#4e342e"

            >
            </a-cone>


        </a-entity>


    </a-marker>


</a-scene>



<script>


// =========================================
// ตัวแปร
// =========================================

let speed = 0;

let flying = true;

const maxSpeed = 10;

const minSpeed = 0;


const bird =
    document.getElementById("bird");

const leftWing =
    document.getElementById("leftWing");

const rightWing =
    document.getElementById("rightWing");

const speedText =
    document.getElementById("speedText");

const stopButton =
    document.getElementById("stopButton");

const marker =
    document.getElementById("hiroMarker");

const status =
    document.getElementById("status");


// =========================================
// เพิ่มความเร็ว
// =========================================

function increaseSpeed() {

    if (speed < maxSpeed) {

        speed++;

        updateSpeed();

    }

}


// =========================================
// ลดความเร็ว
// =========================================

function decreaseSpeed() {

    if (speed > minSpeed) {

        speed--;

        updateSpeed();

    }

}


// =========================================
// Update ความเร็ว
// =========================================

function updateSpeed() {

    speedText.innerHTML =
        "ความเร็วนก: " + speed;

}


// =========================================
// หยุด / เริ่มบิน
// =========================================

function toggleFlight() {

    flying = !flying;


    if (flying) {

        stopButton.innerHTML =
            "⏹ หยุดบิน";

    }

    else {

        stopButton.innerHTML =
            "▶ เริ่มบิน";

    }

}


// =========================================
// Animation
// =========================================

let time = 0;


function animateBird() {

    requestAnimationFrame(
        animateBird
    );


    if (!flying) {

        return;

    }


    // -----------------------------
    // กระพือปีก
    // -----------------------------

    const wingAngle =
        Math.sin(time * 0.25) * 35;


    leftWing.setAttribute(

        "rotation",

        `0 0 ${-wingAngle}`

    );


    rightWing.setAttribute(

        "rotation",

        `0 0 ${wingAngle}`

    );


    // -----------------------------
    // บินขึ้นลงเล็กน้อย
    // -----------------------------

    const birdY =
        1 + Math.sin(time * 0.05) * 0.12;


    bird.object3D.position.y =
        birdY;


    // -----------------------------
    // บินไปข้างหน้า
    // -----------------------------

    bird.object3D.position.z +=
        speed * 0.0008;


    // -----------------------------
    // ถ้าบินไกลเกินไป
    // ให้กลับมาเริ่มใหม่
    // -----------------------------

    if (
        bird.object3D.position.z > 2
    ) {

        bird.object3D.position.z =
            -1;

    }


    time++;

}


animateBird();


// =========================================
// Marker Found
// =========================================

marker.addEventListener(

    "markerFound",

    function () {

        status.innerHTML =
            "✅ พบ Hiro Marker — พบแล้ว! นกกำลังบิน 🐦";

        status.style.background =
            "rgba(0,150,0,0.8)";

    }

);


// =========================================
// Marker Lost
// =========================================

marker.addEventListener(

    "markerLost",

    function () {

        status.innerHTML =
            "🔍 กรุณาส่องกล้องไปที่ Hiro Marker";

        status.style.background =
            "rgba(0,0,0,0.75)";

    }

);


</script>


</body>

</html>
